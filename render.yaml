services:
  - type: web
    name: twigthetics
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_INSTAGRAM_URL
        value: https://www.instagram.com/twigthetics/
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: PORTAL_PREVIEW_MODE
        value: "1"
      - key: NEXT_PUBLIC_GUIDE_CHECKOUT_URL
        sync: false
      - key: NEXT_PUBLIC_APPLICATION_ENDPOINT
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_COACHING_PRICE_ID
        sync: false
